<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="875" viewBox="0 0 1040 875" role="img" aria-labelledby="title desc">
<title id="title">UC-7: Keep automation working through VCS change</title><desc id="desc">UC-7: A repository rewrites Git history or adopts a different VCS. Normalize Git changesets and refs into recorded facts. Deduplicate observed work by content across rewritten SHAs. Detect orphaned cursors and safely resume exact replays. Observe a declared Jujutsu repository through its own adapter. Git rewrites replay safely; another VCS still needs a selected adapter. Jujutsu adapter and selection · discovered; Durable rewrite lineage · discovered</desc>
