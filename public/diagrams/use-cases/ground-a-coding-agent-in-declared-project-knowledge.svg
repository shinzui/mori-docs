<title id="title">UC-5: Ground a coding agent</title><desc id="desc">UC-5: An agent or engineer opens an unfamiliar repository. Read project identity, dependencies, standards, and agent hints. Resolve dependency source and curated docs by project name. Search concepts and worked examples with provenance. Assemble role context and cite facts with resolvable mori:// URIs. The task starts from declared, inspectable project knowledge. Protocol-neutral agent access · discovered; Curated reference freshness · discovered</desc>
