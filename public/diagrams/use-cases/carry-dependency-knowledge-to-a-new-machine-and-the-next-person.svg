<title id="title">UC-6: Carry dependency knowledge forward</title><desc id="desc">UC-6: A teammate needs a hard-won dependency answer on a new machine. Keep upstream source and curated findings under one identity. Resolve the wrapper by name, independent of checkout layout. Search docs and typed findings across registered projects. Acquire a fleet index before visiting every checkout. Findings stay with the dependency; fresh-machine lookup awaits registry sync. Registry sync between machines · discovered; Low-friction read tier · discovered</desc>
