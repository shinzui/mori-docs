<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="875" viewBox="0 0 1040 875" role="img" aria-labelledby="title desc">
<title id="title">UC-2: Upgrade a dependency tree in order</title><desc id="desc">UC-2: Project A records a major release; B depends on A, and C depends on both. Record a durable release fact and find its dependents. Preflight a bounded reverse graph in topological waves. Checkpoint the graph; advance a target after its upstream steps succeed. Show completed, blocked, and independent branches under one workflow. B upgrades before C, while failures block only their descendants. Constraint-aware release classification · planned; Agent-driven upgrade repair · planned</desc>
