<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="875" viewBox="0 0 1040 875" role="img" aria-labelledby="title desc">
<title id="title">UC-4: Trust repository automation</title><desc id="desc">UC-4: A maintainer leaves repository reactions running unattended. Keep project identity separate from automation configuration. Check target consent and enforce delivery reach limits. Inspect why a selector matched and trace what each reaction did. Rebuild projections and audit durable provenance after logs are gone. A maintainer can explain reach, cause, execution, and recorded history. ExecutionPolicy enforcement · discovered; Selective event compaction · blocked</desc>
