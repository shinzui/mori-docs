<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="875" viewBox="0 0 1040 875" role="img" aria-labelledby="title desc">
<title id="title">UC-3: Regenerate after a contract change</title><desc id="desc">UC-3: A producer changes an OpenAPI, protobuf, Dhall, or DDL contract. Match changed contract paths and emit a structured signal. Resolve direct consumers from declared dependencies. Check target consent, then run its bounded regeneration command. Coalesce repeat changes and show each consumer's delivery state. Each consenting consumer regenerates its own derived artifacts. Agent-driven regeneration and call-site repair · planned</desc>
