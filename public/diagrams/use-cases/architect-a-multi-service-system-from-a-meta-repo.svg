<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="767" viewBox="0 0 1040 767" role="img" aria-labelledby="title desc">
<title id="title">UC-1: Architect a 30-service system</title><desc id="desc">UC-1: An architect needs a current view across many changing service models. Declare bounded contexts, flows, and terms in DDD models. Group the fleet and query its context models with canonical sources. Compare the target context map with the services' current models. Validate decision references and refresh reports after model changes. Architecture decisions and migrations stay grounded in a queryable system view. </desc>
